<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Full Stint — WEC GT3: 24 спрайта</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#081a2a,#10131d);color:#eff6ff;font:14px system-ui,Arial,sans-serif}
main{max-width:1180px;margin:auto;padding:28px}h1{font-size:clamp(24px,4vw,42px);margin:0 0 8px;letter-spacing:-.03em}h1 em{font-style:normal;color:#ffb64a}
p{color:#b6cede}a{color:#3addf9}#status{display:inline-block;padding:8px 12px;border-radius:10px;background:#12364a;color:#a5eaff;margin:12px 0 20px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:15px}
article{background:#102738;border:1px solid #285571;border-radius:14px;padding:16px;box-shadow:0 12px 30px #0006}
h2{font-size:17px;font-weight:800;margin:0 0 12px}article .variants{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.variant{position:relative;display:flex;min-height:232px;align-items:center;flex-direction:column;gap:8px;padding:9px;border-radius:10px;background:repeating-linear-gradient(45deg,#1d3342 0 10px,#1c2938 10px 20px);overflow:hidden}
.variant img{width:100px;height:198px;object-fit:contain;filter:drop-shadow(0 6px 8px #0009);image-rendering:auto}
.variant span{font-size:12px;color:#ffba62;font-weight:700}.variant.invalid{outline:2px solid #ff5b5b}
footer{margin-top:25px;color:#90b1c3}
</style></head>
<body><main><h1>FULL <em>STINT</em> — GT3 / WEC</h1>
<p>Проверка игровых спрайтов: 12 моделей, 2 ливреи для каждой. Машины расположены носом вверх, фон прозрачный.</p>
<div id="status">Загрузка изображений…</div><div id="grid"></div>
<footer><a href="../index.html">Вернуться в Full Stint</a> · <a href="../">Открыть игру</a></footer>
<script>
const cars=[['aston_gt3','Aston Martin Vantage GT3'],['audi_gt3','Audi R8 LMS GT3'],['bentley_gt3','Bentley Continental GT3'],['bmw_gt3','BMW M4 GT3'],['corvette_gt3','Chevrolet Corvette GT3'],['ferrari_gt3','Ferrari 296 GT3'],['lambo_gt3','Lamborghini Huracán GT3'],['lexus_gt3','Lexus RC F GT3'],['mclaren_gt3','McLaren 720S GT3'],['mercedes_gt3','Mercedes-AMG GT3'],['mustang_gt3','Ford Mustang GT3'],['porsche_gt3','Porsche 911 GT3 R']];
let loaded=0,errors=0;
const status=document.getElementById('status'),grid=document.getElementById('grid');
const refresh=()=>{status.textContent='Загружено '+loaded+' / 24'+(errors?' · Ошибки: '+errors:'');status.style.color=errors?'#ff9a99':'#a5eaff';};
for(const [id,label] of cars){
 const card=document.createElement('article');const name=document.createElement('h2');name.textContent=label;card.appendChild(name);
 const variants=document.createElement('div');variants.className='variants';card.appendChild(variants);grid.appendChild(card);
 for(const v of [1,2]){
  const wrap=document.createElement('div');wrap.className='variant';
  const img=document.createElement('img');img.loading='lazy';img.alt=label+' · ливрея '+v;
  const title=document.createElement('span');title.textContent='ЛИВРЕЯ '+v;
  img.onload=()=>{if(img.naturalWidth<100||img.naturalHeight<180){wrap.classList.add('invalid');errors++;}else loaded++;refresh();};
  img.onerror=()=>{wrap.classList.add('invalid');errors++;refresh();};
  img.src='../assets/gt3/wec-custom/'+id+'-livery-'+v+'.webp?v=20261112-gt3-custom-v1';
  wrap.append(img,title);variants.appendChild(wrap);
 }
}
</script></main></body></html>
